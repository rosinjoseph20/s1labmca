<!DOCTYPE html>
<html>
<head>
<title>Side Navigaton Bar</title>
<style>
.sidenav{height:100%;
width:160px;
position:fixed;
padding-top:20px;
background-color:green;
position:fixed;
top:0;
left:0;
box-sizing:border-box;
}
.sidenav h3{
color:white;
text-align:center;
}
.sidenav a{
display:block;
text-decoration:none;
padding:6px 8px 6px 16px;
color:white;
}
.sidenav a:hover{
color:red;
}
.main{
margin-left:160px;
padding: 0px 10px;
height:2000px;
box-sizing:border-box;
}
</style>
</head>
<body>
<div class="sidenav">
<h3>Menu</h3>
<a href="#about">About Us</a>
<a href="#departments">Department</a>
<a href="#vision">Vision</a>
<a href="#mission">Mission</a>
<a href="#contact">Contact Us</a>
</div>
<div class="main">
<h1>Side Bar</h1>
<h2 id="about">About Us</h2>
<p>Welcome to our college</P>
<h2 id="departments">Departments</h2>
<p>Our college has various department</p>
<h2 id="vision">vision</h2>
<p>Our vision is to achieve excellence and growth</p>
<h2 id="mission">Mission</h2>
<p>Our mission is to provide quality educaton</P>
<h2 id="contact">Contact Us</h2>
<p>Email:cecchegannur@gmail.com</p>
</div>
</body>
</html>
